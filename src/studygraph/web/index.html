<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>StudyGraph</title>
    <link rel="stylesheet" href="/static/styles.css">
    <script defer src="/static/app.js"></script>
  </head>
  <body>
    <div id="app" class="app-shell">
      <header class="topbar">
        <div class="brand">
          <div class="brand-mark" aria-hidden="true">
            <span></span>
            <span></span>
            <span></span>
          </div>
          <div>
            <h1>StudyGraph</h1>
            <p id="health-status">Checking system status</p>
          </div>
        </div>
        <div class="topbar-actions">
          <form id="auth-form" class="auth-control">
            <input id="auth-username" type="text" maxlength="120" placeholder="Username" autocomplete="username">
            <input id="auth-password" type="password" placeholder="Password" autocomplete="current-password">
            <button class="secondary-button" type="submit">Login</button>
            <button id="register-button" class="icon-button" type="button">Register</button>
            <button id="logout-button" class="icon-button" type="button" hidden>Logout</button>
          </form>
          <label class="owner-control">
            <span>Owner</span>
            <input
              id="owner-input"
              type="text"
              maxlength="120"
              autocomplete="username"
              spellcheck="false"
            >
          </label>
          <button id="refresh-button" class="icon-button" type="button" title="Refresh">
            Refresh
          </button>
        </div>
      </header>

      <main class="workspace">
        <section class="panel upload-panel" aria-labelledby="upload-title">
          <div class="panel-heading">
            <h2 id="upload-title">Upload</h2>
            <span id="upload-state" class="status-badge status-idle">Idle</span>
          </div>
          <form id="upload-form" class="upload-form">
            <label class="file-input">
              <span id="selected-file-name">Select PDF</span>
              <input id="pdf-input" name="file" type="file" accept="application/pdf,.pdf">
            </label>
            <button id="upload-button" class="primary-button" type="submit">
              Upload
            </button>
          </form>
          <p id="notice" class="notice" role="status" aria-live="polite"></p>
        </section>

        <section class="panel search-panel" aria-labelledby="search-title">
          <div class="panel-heading">
            <h2 id="search-title">Search</h2>
            <span id="search-count" class="counter">0 results</span>
          </div>
          <form id="search-form" class="search-form">
            <input
              id="search-input"
              type="search"
              name="query"
              placeholder="Search chunks"
              autocomplete="off"
            >
            <button class="secondary-button" type="submit">Search</button>
          </form>
          <div id="search-results" class="result-list"></div>
          <div class="ask-section">
            <h3>Ask your documents</h3>
            <form id="ask-form" class="search-form">
              <input id="ask-input" type="text" maxlength="200" placeholder="Ask a source-grounded question" required>
              <button class="primary-button" type="submit">Ask</button>
            </form>
            <div id="ask-output" class="ask-output empty-state">No question asked yet</div>
          </div>
        </section>

        <section class="panel documents-panel" aria-labelledby="documents-title">
          <div class="panel-heading">
            <h2 id="documents-title">Documents</h2>
            <label class="filter-control">
              <span class="sr-only">Filter by collection</span>
              <select id="collection-filter" aria-label="Filter by collection">
                <option value="">All collections</option>
              </select>
            </label>
            <span id="document-count" class="counter">0 stored</span>
          </div>
          <div id="document-list" class="document-list"></div>
        </section>

        <section class="panel collections-panel" aria-labelledby="collections-title">
          <div class="panel-heading">
            <h2 id="collections-title">Collections</h2>
            <span id="collection-count" class="counter">0 saved</span>
          </div>
          <form id="collection-form" class="collection-form">
            <input id="collection-name" type="text" maxlength="120" placeholder="New collection" required>
            <button class="secondary-button" type="submit">Create</button>
          </form>
          <div id="collection-list" class="collection-list"></div>
        </section>

        <section class="panel detail-panel" aria-labelledby="detail-title">
          <div class="panel-heading">
            <h2 id="detail-title">Details</h2>
            <button id="delete-button" class="danger-button" type="button" disabled>
              Delete
            </button>
          </div>
          <div id="document-detail" class="document-detail empty-state">
            No document selected
          </div>
          <div id="learning-tools" class="learning-tools" hidden>
            <div class="tool-actions">
              <button id="summary-button" class="secondary-button" type="button">Summary</button>
              <button id="quiz-button" class="secondary-button" type="button">Create quiz</button>
              <button id="flashcards-button" class="secondary-button" type="button">Flashcards</button>
              <button id="review-button" class="primary-button" type="button">Mark reviewed</button>
              <button id="mastery-button" class="icon-button" type="button">Mark mastered</button>
            </div>
            <div id="learning-output" class="learning-output"></div>
          </div>
          <div id="chunk-list" class="chunk-list"></div>
        </section>
      </main>
    </div>
  </body>
</html>
