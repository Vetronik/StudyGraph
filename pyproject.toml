[build-system]
requires = ["setuptools>=84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "studygraph"
version = "0.1.0"
description = "A small learning project for extracting text from study PDFs."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "alembic>=1.19.1",
    "fastapi>=0.141.1",
    "pypdf>=4.0.0",
    "Pillow>=12.3.0",
    "PyMuPDF>=1.24.0",
    "psycopg[binary]>=3.2.0",
    "pytesseract>=0.3.13",
    "python-multipart>=0.0.32",
    "sqlalchemy>=2.0.52",
    "uvicorn>=0.52.4",
]

[project.optional-dependencies]
test = [
    "httpx>=0.27.0",
    "pytest>=9.1.1",
]
dev = [
    "ruff>=0.16.6",
]

[project.scripts]
studygraph = "studygraph.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
studygraph = ["web/*.html", "web/*.css", "web/*.js"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = [
    "postgresql: tests that require TEST_DATABASE_URL and a dedicated PostgreSQL test database",
]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
