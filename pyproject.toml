[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "studygraph"
version = "0.1.0"
description = "A small learning project for extracting text from study PDFs."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "alembic>=1.16.0",
    "fastapi>=0.115.0",
    "pypdf>=4.0.0",
    "psycopg[binary]>=3.2.0",
    "python-multipart>=0.0.9",
    "sqlalchemy>=2.0.0",
    "uvicorn>=0.30.0",
]

[project.optional-dependencies]
test = [
    "httpx>=0.27.0",
    "pytest>=8.0.0",
]

[project.scripts]
studygraph = "studygraph.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = [
    "postgresql: tests that require TEST_DATABASE_URL and a dedicated PostgreSQL test database",
]
