services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-studygraph_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-studygraph_password}
      POSTGRES_DB: ${POSTGRES_DB:-studygraph}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    restart: unless-stopped
    build:
      context: .
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-studygraph_user}:${POSTGRES_PASSWORD:-studygraph_password}@postgres:5432/${POSTGRES_DB:-studygraph}
      STUDYGRAPH_AUTH_SECRET: ${STUDYGRAPH_AUTH_SECRET:-development-only-change-this-secret-change-me}
      STUDYGRAPH_REQUIRE_AUTH_TOKEN: ${STUDYGRAPH_REQUIRE_AUTH_TOKEN:-false}
      STUDYGRAPH_DOCUMENT_STORAGE_DIR: /app/data/documents
      STUDYGRAPH_LOG_LEVEL: ${STUDYGRAPH_LOG_LEVEL:-INFO}
      STUDYGRAPH_MAX_UPLOAD_BYTES: ${STUDYGRAPH_MAX_UPLOAD_BYTES:-10485760}
      STUDYGRAPH_MAX_DOCUMENT_PAGES: ${STUDYGRAPH_MAX_DOCUMENT_PAGES:-500}
      STUDYGRAPH_MAX_DOCUMENT_CHARACTERS: ${STUDYGRAPH_MAX_DOCUMENT_CHARACTERS:-1000000}
      STUDYGRAPH_MAX_PROCESSING_ATTEMPTS: ${STUDYGRAPH_MAX_PROCESSING_ATTEMPTS:-3}
      STUDYGRAPH_OCR_ENABLED: ${STUDYGRAPH_OCR_ENABLED:-true}
      STUDYGRAPH_OCR_LANGUAGE: ${STUDYGRAPH_OCR_LANGUAGE:-deu+eng}
      STUDYGRAPH_REQUIRE_USER_HEADER: ${STUDYGRAPH_REQUIRE_USER_HEADER:-false}
      STUDYGRAPH_EMBEDDING_PROVIDER: ${STUDYGRAPH_EMBEDDING_PROVIDER:-deterministic}
      STUDYGRAPH_EMBEDDING_MODEL: ${STUDYGRAPH_EMBEDDING_MODEL:-text-embedding-3-small}
      STUDYGRAPH_EMBEDDING_API_KEY: ${STUDYGRAPH_EMBEDDING_API_KEY:-}
      STUDYGRAPH_EMBEDDING_API_URL: ${STUDYGRAPH_EMBEDDING_API_URL:-https://api.openai.com/v1/embeddings}
    ports:
      - "${API_PORT:-8000}:8000"
    volumes:
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready')"]
      interval: 5s
      timeout: 5s
      retries: 10
    depends_on:
      postgres:
        condition: service_healthy

  worker:
    restart: unless-stopped
    build:
      context: .
    command: ["python", "-m", "studygraph.worker"]
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-studygraph_user}:${POSTGRES_PASSWORD:-studygraph_password}@postgres:5432/${POSTGRES_DB:-studygraph}
      STUDYGRAPH_AUTH_SECRET: ${STUDYGRAPH_AUTH_SECRET:-development-only-change-this-secret-change-me}
      STUDYGRAPH_DOCUMENT_STORAGE_DIR: /app/data/documents
      STUDYGRAPH_LOG_LEVEL: ${STUDYGRAPH_LOG_LEVEL:-INFO}
      STUDYGRAPH_MAX_DOCUMENT_PAGES: ${STUDYGRAPH_MAX_DOCUMENT_PAGES:-500}
      STUDYGRAPH_MAX_DOCUMENT_CHARACTERS: ${STUDYGRAPH_MAX_DOCUMENT_CHARACTERS:-1000000}
      STUDYGRAPH_MAX_PROCESSING_ATTEMPTS: ${STUDYGRAPH_MAX_PROCESSING_ATTEMPTS:-3}
      STUDYGRAPH_OCR_ENABLED: ${STUDYGRAPH_OCR_ENABLED:-true}
      STUDYGRAPH_OCR_LANGUAGE: ${STUDYGRAPH_OCR_LANGUAGE:-deu+eng}
      STUDYGRAPH_EMBEDDING_PROVIDER: ${STUDYGRAPH_EMBEDDING_PROVIDER:-deterministic}
      STUDYGRAPH_EMBEDDING_MODEL: ${STUDYGRAPH_EMBEDDING_MODEL:-text-embedding-3-small}
      STUDYGRAPH_EMBEDDING_API_KEY: ${STUDYGRAPH_EMBEDDING_API_KEY:-}
      STUDYGRAPH_EMBEDDING_API_URL: ${STUDYGRAPH_EMBEDDING_API_URL:-https://api.openai.com/v1/embeddings}
    volumes:
      - ./data:/app/data
    depends_on:
      api:
        condition: service_healthy

volumes:
  postgres_data:
