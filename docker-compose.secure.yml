services:
  postgres:
    ports: !reset []
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER for secure deployment}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD for secure deployment}
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB for secure deployment}

  api:
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:?Set POSTGRES_USER for secure deployment}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD for secure deployment}@postgres:5432/${POSTGRES_DB:?Set POSTGRES_DB for secure deployment}
      STUDYGRAPH_AUTH_SECRET: ${STUDYGRAPH_AUTH_SECRET:?Set STUDYGRAPH_AUTH_SECRET to a strong secret}
      STUDYGRAPH_REQUIRE_AUTH_TOKEN: "true"
      STUDYGRAPH_REQUIRE_USER_HEADER: "false"
      STUDYGRAPH_PROCESS_UPLOADS_IN_API: "false"
      STUDYGRAPH_ALLOWED_HOSTS: ${STUDYGRAPH_ALLOWED_HOSTS:-localhost,127.0.0.1}
      STUDYGRAPH_METRICS_ENABLED: ${STUDYGRAPH_METRICS_ENABLED:-true}
      STUDYGRAPH_EMBEDDING_PROVIDER: "openai-compatible"
      STUDYGRAPH_EMBEDDING_MODEL: ${STUDYGRAPH_EMBEDDING_MODEL:?Set STUDYGRAPH_EMBEDDING_MODEL for secure deployment}
      STUDYGRAPH_EMBEDDING_API_KEY: ${STUDYGRAPH_EMBEDDING_API_KEY:?Set STUDYGRAPH_EMBEDDING_API_KEY for secure deployment}
      STUDYGRAPH_EMBEDDING_API_URL: ${STUDYGRAPH_EMBEDDING_API_URL:-https://api.openai.com/v1/embeddings}

  worker:
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:?Set POSTGRES_USER for secure deployment}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD for secure deployment}@postgres:5432/${POSTGRES_DB:?Set POSTGRES_DB for secure deployment}
      STUDYGRAPH_AUTH_SECRET: ${STUDYGRAPH_AUTH_SECRET:?Set STUDYGRAPH_AUTH_SECRET to a strong secret}
      STUDYGRAPH_EMBEDDING_PROVIDER: "openai-compatible"
      STUDYGRAPH_EMBEDDING_MODEL: ${STUDYGRAPH_EMBEDDING_MODEL:?Set STUDYGRAPH_EMBEDDING_MODEL for secure deployment}
      STUDYGRAPH_EMBEDDING_API_KEY: ${STUDYGRAPH_EMBEDDING_API_KEY:?Set STUDYGRAPH_EMBEDDING_API_KEY for secure deployment}
      STUDYGRAPH_EMBEDDING_API_URL: ${STUDYGRAPH_EMBEDDING_API_URL:-https://api.openai.com/v1/embeddings}
