name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: studygraph_user
          POSTGRES_PASSWORD: studygraph_password
          POSTGRES_DB: studygraph_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U studygraph_user -d studygraph_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      TEST_DATABASE_URL: postgresql+psycopg://studygraph_user:studygraph_password@localhost:5432/studygraph_test

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install package
        run: python -m pip install -e ".[test,dev]"

      - name: Run Ruff
        run: python -m ruff check .

      - name: Build Docker image
        run: docker build --tag studygraph:ci .

      - name: Run tests
        run: python -m pytest
