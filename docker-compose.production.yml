services:
  api:
    ports: !reset []

  proxy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      STUDYGRAPH_DOMAIN: ${STUDYGRAPH_DOMAIN:?Set STUDYGRAPH_DOMAIN for TLS}
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    healthcheck:
      test: ["CMD", "wget", "--spider", "--no-verbose", "http://127.0.0.1:2019/config/"]
      interval: 10s
      timeout: 5s
      retries: 12
    depends_on:
      api:
        condition: service_healthy

volumes:
  caddy_data:
  caddy_config:
